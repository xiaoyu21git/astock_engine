version: 1
namespace: trading.watch.emotion_repair_second_divergence_failed
rules:
  - id: emotion-repair-second-divergence-failed-block
    name: 情绪修复二次分歧失败阻断规则
    stage: signal
    priority: 97
    description: 情绪修复中二次分歧无法完成再修复并失守支点时，取消继续跟踪。
    tags: [a_share_short_term, watch, emotion_repair, second_divergence_failed]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: market.emotion_repair_confirmed
        - op: truthy
          value:
            var: candidate.second_divergence_failed_confirmed
        - op: lt
          left:
            var: candidate.repair_strength_drop_ratio
          right: 0.75
        - op: lt
          left:
            var: candidate.close_below_repair_divergence_pivot_ratio
          right: 0.998
    then:
      result: block
      reason_code: emotion_repair_second_divergence_failed_block
      message: 情绪修复二次分歧失败，取消继续跟踪
      payload:
        state: abandoned
        action: unwatch

  - id: emotion-repair-second-divergence-continue-watch
    name: 情绪修复继续观察规则
    stage: signal
    priority: 60
    description: 情绪修复中二次分歧仍可控时，仅继续观察。
    tags: [a_share_short_term, watch, emotion_repair, continue]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: market.emotion_repair_confirmed
        - op: ge
          left:
            var: candidate.repair_strength_drop_ratio
          right: 0.75
    then:
      result: pass
      reason_code: emotion_repair_second_divergence_continue_watch
      message: 情绪修复二次分歧仍可控，继续观察
      payload:
        state: watchlist