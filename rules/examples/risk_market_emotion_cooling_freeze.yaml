version: 1
namespace: trading.risk.market_emotion_cooling
rules:
  - id: market-emotion-cooling-freeze
    name: 情绪退潮冻结新开仓
    stage: market
    priority: 100
    description: 市场情绪处于退潮或恐慌且市场宽度或回封率同步恶化时, 无条件冻结新增仓位。注意: 使用 freeze 动作而非 state_switch, 确保规则闸门实际拦截。
    tags: [market, risk, emotion_cycle, freeze]
    when:
      op: all
      conditions:
        - op: any
          conditions:
            - op: eq
              left:
                var: market.emotion_cycle
              right: cooling
            - op: eq
              left:
                var: market.emotion_cycle
              right: panic
        - op: any
          conditions:
            - op: lt
              left:
                var: market.breadth_above_ma60_ratio
              right: 0.40
            - op: lt
              left:
                var: market.limit_up_reseal_rate
              right: 0.60
    then:
      result: freeze
      reason_code: market_emotion_cooling_freeze
      message: 市场情绪退潮扩散, 冻结新增仓位
      payload:
        state: frozen
        gate_level: market_defense_freeze
        blocked_actions: [candidate_entry, open]
        focus: 优先观察、减仓与风险回收
