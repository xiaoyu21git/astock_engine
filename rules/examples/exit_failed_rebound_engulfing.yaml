version: 1
namespace: trading.exit.failed_rebound_engulfing
rules:
  - id: failed-rebound-engulfing-exit
    name: 反包失败退出规则
    stage: rebalance
    priority: 94
    description: 反包尝试失败且承接继续转弱时，直接退出。
    tags: [a_share_short_term, exit, failed_rebound, engulfing]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: position.failed_engulfing_confirmed
        - op: lt
          left:
            var: position.acceptance_strength_score
          right: 45
        - op: ge
          left:
            var: position.intraday_pullback_percent
          right: 4.0
    then:
      result: exit
      reason_code: failed_rebound_engulfing_exit
      message: 反包失败并重新走弱，执行退出
      payload:
        reduce_ratio: 1.0
        state: cooldown

  - id: failed-rebound-engulfing-reduce
    name: 反包失败预警减仓规则
    stage: rebalance
    priority: 82
    description: 反包失败初期先减仓观察，不立即清仓。
    tags: [a_share_short_term, exit, failed_rebound, reduce]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: position.failed_engulfing_confirmed
        - op: ge
          left:
            var: position.acceptance_strength_score
          right: 45
        - op: lt
          left:
            var: position.acceptance_strength_score
          right: 60
    then:
      result: reduce
      reason_code: failed_rebound_engulfing_reduce
      message: 反包失败预警，先减仓处理
      payload:
        reduce_ratio: 0.5
        state: defense_mode