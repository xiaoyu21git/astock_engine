version: 1
namespace: trading.watch.sector_repair_leader_only_followers_stall
rules:
  - id: sector-repair-leader-only-followers-stall-block
    name: 板块修复时核心独强后排失速阻断规则
    stage: signal
    priority: 97
    description: 板块修复时只有核心独强、后排跟随失速并失守参考位时，取消继续跟踪弱侧个股。
    tags: [a_share_short_term, watch, sector_repair, leader_only]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: market.sector_repair_confirmed
        - op: ge
          left:
            var: candidate.leader_only_repair_gap_score
          right: 68
        - op: lt
          left:
            var: candidate.follower_stall_strength_ratio
          right: 0.72
        - op: lt
          left:
            var: candidate.close_below_repair_follow_reference_ratio
          right: 0.998
    then:
      result: block
      reason_code: sector_repair_leader_only_followers_stall_block
      message: 板块修复时仅核心独强，后排已失速，取消继续跟踪
      payload:
        state: abandoned
        action: unwatch

  - id: sector-repair-leader-only-continue-watch
    name: 板块修复继续观察规则
    stage: signal
    priority: 60
    description: 板块修复中个股仍保留一定跟随强度时，仅继续观察。
    tags: [a_share_short_term, watch, sector_repair, continue]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: market.sector_repair_confirmed
        - op: lt
          left:
            var: candidate.leader_only_repair_gap_score
          right: 68
        - op: ge
          left:
            var: candidate.follower_stall_strength_ratio
          right: 0.72
    then:
      result: pass
      reason_code: sector_repair_leader_only_continue_watch
      message: 板块修复中后排仍有一定跟随，继续观察
      payload:
        state: watchlist