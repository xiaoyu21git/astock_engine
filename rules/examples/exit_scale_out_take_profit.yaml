version: 1
namespace: trading.exit.scale_out_take_profit
rules:
  # ═══ 结构止盈链 (恢复 08-03 版本): 前高压力→超涨→动态回撤保护→动能衰减→支撑破位 ═══

  - id: pressure-reduce
    name: 前高压力减仓
    stage: rebalance
    priority: 86
    when:
      op: all
      conditions:
        - op: ge
          left:
            var: position.pnl_percent
          right: 3
        - op: ge
          left:
            var: position.previous_high_breakout_ratio
          right: 0.85
    then:
      result: reduce
      reason_code: pressure
      message: 前高压力, 减30%
      payload:
        reduce_ratio: 0.3
        state: pressure

  - id: overextend-reduce
    name: 超涨减仓
    stage: rebalance
    priority: 83
    when:
      op: all
      conditions:
        - op: ge
          left:
            var: position.pnl_percent
          right: 5
        - op: ge
          left:
            var: position.close_below_rebound_pivot_ratio
          right: 1.1
    then:
      result: reduce
      reason_code: overextend
      message: 超涨, 减30%
      payload:
        reduce_ratio: 0.3
        state: overextend

  - id: trailing-protect
    name: 动态回撤保护
    stage: rebalance
    priority: 81
    when:
      op: all
      conditions:
        - op: ge
          left:
            var: position.pnl_percent
          right: 8
        - op: ge
          left:
            var: position.trailing_drawdown_ratio
          right: 0.06
    then:
      result: exit
      reason_code: trailing
      message: 回撤6%, 清仓锁利
      payload:
        reduce_ratio: 1.0
        state: trail_exit

  - id: momentum-fade-reduce
    name: 动能衰减减仓
    stage: rebalance
    priority: 80
    when:
      op: all
      conditions:
        - op: ge
          left:
            var: position.pnl_percent
          right: 3
        - op: lt
          left:
            var: position.trend_health_score
          right: 50
    then:
      result: reduce
      reason_code: momentum_fade
      message: 动能衰减, 减30%
      payload:
        reduce_ratio: 0.3
        state: momentum_fade

  - id: support-break-exit
    name: 支撑破位清仓
    stage: rebalance
    priority: 77
    when:
      op: all
      conditions:
        - op: ge
          left:
            var: position.pnl_percent
          right: 2
        - op: lt
          left:
            var: position.close_below_rebound_pivot_ratio
          right: 1.0
    then:
      result: exit
      reason_code: support_break
      message: 破MA20, 清仓
      payload:
        reduce_ratio: 1.0
        state: support_exit
