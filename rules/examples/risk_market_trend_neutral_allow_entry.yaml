version: 1
namespace: trading.risk.market_trend_neutral_allow_entry
rules:
  - id: market-trend-neutral-allow-entry
    name: 趋势中性环境放行规则
    stage: market
    priority: 82
    description: 市场体制为牛市或震荡且回撤可控时允许日线趋势策略筛选新仓。不再以极低阈值(breadth≥0.12, strength≥0.02)做橡皮图章放行。
    tags: [market, gate, trend, neutral_market, allow_entry]
    when:
      op: all
      conditions:
        - op: le
          left:
            var: market.drawdown_from_recent_high
          right: 0.25
        - op: any
          conditions:
            - op: eq
              left:
                var: market.regime_state
              right: bull
            - op: eq
              left:
                var: market.regime_state
              right: sideways
    then:
      result: state_switch
      reason_code: market_trend_neutral_allow_entry
      message: 市场处于牛市或震荡体制且回撤可控, 允许筛选日线趋势新仓
      payload:
        state: selective_active
        gate_level: trend_neutral_allow
        allow_actions: [observe, candidate_entry, open]
        focus: 优先放行回踩确认、平台突破和中继趋势类候选
      state:
        market_state: selective_active
