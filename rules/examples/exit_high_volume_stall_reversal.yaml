version: 1
namespace: trading.exit.high_volume_stall_reversal
rules:
  - id: high-volume-stall-reversal-exit
    name: 高位放量滞胀转杀退出规则
    stage: rebalance
    priority: 94
    description: 高位放量滞胀后转为明显抛压回落并失守关键支点时，执行退出。
    tags: [a_share_short_term, exit, high_volume, stall_reversal]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: position.high_volume_stall_confirmed
        - op: lt
          left:
            var: position.price_progress_stall_ratio
          right: 0.995
        - op: lt
          left:
            var: position.close_below_stall_pivot_ratio
          right: 0.997
        - op: ge
          left:
            var: position.selling_pressure_score
          right: 72
    then:
      result: exit
      reason_code: high_volume_stall_reversal_exit
      message: 高位放量滞胀转杀，执行退出
      payload:
        reduce_ratio: 1.0
        state: cooldown

  - id: high-volume-stall-reversal-reduce
    name: 高位放量滞胀转杀减仓规则
    stage: rebalance
    priority: 81
    description: 高位放量滞胀开始转弱但尚未完全失控时，先减仓防守。
    tags: [a_share_short_term, exit, high_volume, reduce]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: position.high_volume_stall_confirmed
        - op: lt
          left:
            var: position.price_progress_stall_ratio
          right: 0.998
        - op: ge
          left:
            var: position.selling_pressure_score
          right: 60
        - op: lt
          left:
            var: position.selling_pressure_score
          right: 72
    then:
      result: reduce
      reason_code: high_volume_stall_reversal_reduce
      message: 高位放量滞胀转弱，先减仓防守
      payload:
        reduce_ratio: 0.5
        state: defense_mode