version: 1
namespace: trading.entry.pullback_ma20_support
rules:
  - id: pullback-ma20-invalidated
    name: 回踩20日线失效规则
    stage: signal
    priority: 97
    description: 回踩 20 日线后未能企稳或趋势斜率转弱时，不推进趋势延续候选。
    tags: [a_share_short_term, entry, pullback, ma20, invalidation]
    when:
      op: any
      conditions:
        - op: not
          value:
            var: candidate.pullback_ma20_support_confirmed
        - op: lt
          left:
            var: candidate.close_to_ma20_ratio
          right: 0.985
        - op: lt
          left:
            var: candidate.ma20_trend_slope
          right: 0.0
    then:
      result: block
      reason_code: pullback_ma20_invalidated
      message: 回踩20日线后未能企稳，不进入趋势延续候选
      payload:
        state: watch_only

  - id: pullback-ma20-candidate
    name: 回踩20日线候选规则
    stage: signal
    priority: 89
    description: 上升趋势中回踩 20 日线并重新企稳时，输出趋势延续候选。
    tags: [a_share_short_term, entry, pullback, ma20]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: candidate.pullback_ma20_support_confirmed
        - op: ge
          left:
            var: candidate.close_to_ma20_ratio
          right: 1.0
        - op: ge
          left:
            var: candidate.ma20_trend_slope
          right: 0.0
        - op: ge
          left:
            var: market.trend_pullback_rebound_rate
          right: 0.35
    then:
      result: candidate_entry
      reason_code: pullback_ma20_candidate
      message: 标的满足回踩20日线趋势延续候选条件
      payload:
        state: ready_to_buy
        entry_style: pullback_ma20
        support_line: ma20
      score:
        var: candidate.close_to_ma20_ratio