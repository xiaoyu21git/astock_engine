version: 1
namespace: trading.exit.high_level_sideways_flush
rules:
  - id: high-level-sideways-flush-exit
    name: 高位横盘后跳水退出规则
    stage: rebalance
    priority: 94
    description: 高位横盘后出现明显跳水并失守整理支点、抛压升高时，执行退出。
    tags: [a_share_short_term, exit, high_level, sideways_flush]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: position.high_level_sideways_confirmed
        - op: truthy
          value:
            var: position.intraday_flush_confirmed
        - op: ge
          left:
            var: position.flush_from_sideways_high_ratio
          right: 0.045
        - op: lt
          left:
            var: position.close_below_sideways_pivot_ratio
          right: 0.997
        - op: ge
          left:
            var: position.selling_pressure_score
          right: 72
    then:
      result: exit
      reason_code: high_level_sideways_flush_exit
      message: 高位横盘后跳水失守，执行退出
      payload:
        reduce_ratio: 1.0
        state: cooldown

  - id: high-level-sideways-flush-reduce
    name: 高位横盘后跳水减仓规则
    stage: rebalance
    priority: 81
    description: 高位横盘后开始跳水但抛压未完全失控时，先减仓防守。
    tags: [a_share_short_term, exit, high_level, reduce]
    when:
      op: all
      conditions:
        - op: truthy
          value:
            var: position.high_level_sideways_confirmed
        - op: truthy
          value:
            var: position.intraday_flush_confirmed
        - op: ge
          left:
            var: position.flush_from_sideways_high_ratio
          right: 0.03
        - op: ge
          left:
            var: position.selling_pressure_score
          right: 60
        - op: lt
          left:
            var: position.selling_pressure_score
          right: 72
    then:
      result: reduce
      reason_code: high_level_sideways_flush_reduce
      message: 高位横盘后跳水转弱，先减仓防守
      payload:
        reduce_ratio: 0.5
        state: defense_mode