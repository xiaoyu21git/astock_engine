      - candidate_entry
      - score
    tags:
      - entry
      - emotion_repair
      - reflow

  - template_id: template_entry_pullback_ma20_support_v1
    display_name: 回踩20日线模板
    file_name: entry_pullback_ma20_support.yaml
    phase: signal
    summary: 上升趋势中回踩 20 日线并重新企稳时，输出趋势延续候选。
    actions:
      - candidate_entry
      - score
    tags:
      - entry
      - pullback
      - ma20

  - template_id: template_entry_pullback_ma20_support_candidate_v1
    display_name: 回踩20日线候选模板
    file_name: entry_pullback_ma20_support_candidate.yaml
    phase: signal
    summary: 上升趋势中回踩 20 日线并重新企稳时，仅输出趋势延续候选，不内置阻断分支。
    actions:
      - candidate_entry
      - score
    tags:
      - entry
      - pullback
      - ma20
      - candidate_only

  - template_id: template_entry_pullback_ma60_support_v1
    display_name: 回踩60日线模板
    file_name: entry_pullback_ma60_support.yaml
