    file_name: eligibility_trend_participation_guard.yaml
    phase: eligibility
    summary: 量比≥0.60、均线偏离收紧至±10~12%、斜率门槛提升, 三个维度同时满足才放行。不满足任一条件静默丢弃。
    actions:
      - pass
    tags:
      - eligibility
      - liquidity
      - trend
      - ma

