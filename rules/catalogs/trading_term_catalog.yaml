version: 1
namespace: a_share_short_term
templates:
  - template_id: template_entry_weak_to_strong_v1
    display_name: 弱转强入场模板
    file_name: entry_weak_to_strong.yaml
    phase: signal
    summary: 先弱后强、修复关键价位并重新放量时，输出候选入场。
    actions:
      - candidate_entry
      - watch
    tags:
      - entry
      - a_share_short_term
      - repair

  - template_id: template_entry_limit_up_reseal_v1
    display_name: 炸板回封模板
    file_name: entry_limit_up_reseal.yaml
    phase: signal
    summary: 炸板后重新回封且承接恢复时，输出回封打板候选。
    actions:
      - candidate_entry
    tags:
      - entry
      - board
      - reseal

  - template_id: template_watch_abandon_leader_replaced_v1
    display_name: 龙头被替代放弃关注模板
    file_name: watch_abandon_leader_replaced.yaml
    phase: signal
    summary: 核心地位丧失、被新龙头替代或题材退潮时，取消观察。
    actions:
      - unwatch
      - note
    tags:
      - watch
      - abandon
      - leader

  - template_id: template_exit_scale_out_take_profit_v1
    display_name: 分批止盈模板
    file_name: exit_scale_out_take_profit.yaml
    phase: rebalance
    summary: "四级止盈(压力+超涨+支撑+回吐): 前高压力92%减30→超涨MA20/110%减30→支撑破位<0.98清仓→回吐≥5%清仓"
    actions:
      - reduce
      - exit
    tags:
      - exit
      - take_profit
      - scale_out

  - template_id: template_risk_market_emotion_cooling_freeze_v1
    display_name: 情绪退潮冻结模板
    file_name: risk_market_emotion_cooling_freeze.yaml
    phase: market
    summary: 市场情绪退潮或恐慌且市场宽度或回封率恶化时, 使用freeze动作无条件冻结新开仓。
    actions:
      - state_switch
      - freeze
    tags:
      - risk
      - market_state
      - emotion_cycle

  - template_id: template_risk_market_high_level_open_board_deterioration_freeze_v1
    display_name: 高位炸板率恶化冻结模板
    file_name: risk_market_high_level_open_board_deterioration_freeze.yaml
    phase: market
    summary: 高位炸板率快速抬升且回封承接塌陷时，冻结高位接力相关新开仓。
    actions:
      - state_switch
      - freeze
    tags:
      - risk
      - market_state
      - open_board

  - template_id: template_risk_market_reseal_rate_drop_freeze_v1
    display_name: 回封率下滑冻结模板
    file_name: risk_market_reseal_rate_drop_freeze.yaml
    phase: market
    summary: 回封成功率快速下滑且接力确认不足时，冻结追涨打板类新开仓。
    actions:
      - state_switch
      - freeze
    tags:
      - risk
      - market_state
      - reseal

  - template_id: template_risk_market_theme_cooling_freeze_v1
    display_name: 题材退潮冻结模板
    file_name: risk_market_theme_cooling_freeze.yaml
    phase: market
    summary: 主线题材宽度收缩且回封确认走弱时，冻结退潮主线上的新开仓。
    actions:
      - state_switch
      - freeze
    tags:
      - risk
      - market_state
      - theme_breadth

  - template_id: template_entry_overtake_rotation_v1
    display_name: 卡位上位模板
    file_name: entry_overtake_rotation.yaml
    phase: signal
    summary: 标的在题材内部完成卡位上位、强度反超原核心时，输出候选入场。
    actions:
      - candidate_entry
    tags:
      - entry
      - rotation
      - overtake

  - template_id: template_entry_catch_up_breakout_v1
    display_name: 补涨启动模板
    file_name: entry_catch_up_breakout.yaml
    phase: signal
    summary: 龙头锁定后，后排补涨品种放量突破关键位时，输出候选入场。
    actions:
      - candidate_entry
      - score
    tags:
      - entry
      - catch_up
      - breakout

  - template_id: template_exit_failed_rebound_engulfing_v1
    display_name: 反包失败退出模板
    file_name: exit_failed_rebound_engulfing.yaml
    phase: rebalance
    summary: 反包尝试失败且价格重新转弱时，优先退出持仓。
    actions:
      - exit
      - reduce
    tags:
      - exit
      - engulfing
      - failed_rebound

  - template_id: template_exit_acceptance_breakdown_v1
    display_name: 承接走弱退出模板
    file_name: exit_acceptance_breakdown.yaml
    phase: rebalance
    summary: "五级止损(硬止损+破位加速+趋势破坏+承接崩塌+减仓): -12%→亏5%+破MA20→趋势坏→承接<20→承接<40+日内回撤≥2%减半仓"
    actions:
      - reduce
      - exit
    tags:
      - exit
      - acceptance
      - breakdown

  - template_id: template_watch_high_divergence_weakening_v1
    display_name: 高位分歧转弱模板
    file_name: watch_high_divergence_weakening.yaml
    phase: signal
    summary: 高位股从强分歧走向弱分歧且核心强度下滑时，取消继续关注。
    actions:
      - unwatch
      - block
    tags:
      - watch
      - divergence
      - weakening

  - template_id: template_exit_broken_board_failed_rebound_v1
    display_name: 断板反抽失败模板
    file_name: exit_broken_board_failed_rebound.yaml
    phase: rebalance
    summary: 连板断板后反抽修复失败且再次回落时，优先退出持仓。
    actions:
      - exit
      - reduce
    tags:
      - exit
      - board_break
      - failed_rebound

  - template_id: template_entry_emotion_reflow_repair_v1
    display_name: 情绪修复回流模板
    file_name: entry_emotion_reflow_repair.yaml
