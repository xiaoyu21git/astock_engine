version: 1
namespace: trading_features
features:
  - feature_id: candidate.previous_weakness_confirmed
    display_name: 前期走弱确认
    scope: symbol
    category: event_state
    value_type: boolean
    description: 标的此前已出现转弱或失势信号，用于弱转强语义识别。
    related_terms: [weak_to_strong]

  - feature_id: candidate.reclaim_reference_ratio
    display_name: 修复关键位比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 当前价格相对关键修复位的比例，大于 1 表示重新站回关键位置。
    related_terms: [weak_to_strong]

  - feature_id: candidate.reclaim_reference_strength
    display_name: 修复强度得分
    scope: symbol
    category: score
    value_type: number
    description: 价格修复质量的综合得分，可直接作为候选排序分数。
    related_terms: [weak_to_strong]

  - feature_id: candidate.volume_ratio_to_5d_avg
    display_name: 相对 5 日均量比
    scope: symbol
    category: volume_price
    value_type: number
    description: 当前量能相对 5 日均量的倍数，是放量和缩量语义的基础字段。
    related_terms: [weak_to_strong, failed_rebound_engulfing, acceptance_breakdown_exit]

  - feature_id: candidate.limit_up_opened
    display_name: 涨停打开事件
    scope: symbol
    category: board_behavior
    value_type: boolean
    description: 标的在当前周期是否出现过炸板或开板行为。
    related_terms: [limit_up_reseal]

  - feature_id: candidate.reseal_confirmed
    display_name: 回封确认
    scope: symbol
    category: board_behavior
    value_type: boolean
    description: 涨停打开后是否重新封板成功。
    related_terms: [limit_up_reseal]

  - feature_id: candidate.open_board_duration_seconds
    display_name: 开板持续秒数
    scope: symbol
    category: board_behavior
    value_type: number
    description: 炸板到回封之间的持续时间，时间越短通常回封质量越高。
    related_terms: [limit_up_reseal]

  - feature_id: candidate.volume_ratio_to_intraday_avg
    display_name: 相对分时均量比
    scope: symbol
    category: volume_price
    value_type: number
    description: 当前分时量能相对盘中平均成交量的倍数。
    related_terms: [limit_up_reseal]

  - feature_id: candidate.leader_replaced
    display_name: 龙头被替代事件
    scope: symbol
    category: theme_rotation
    value_type: boolean
    description: 题材龙头位置已被更强标的取代。
    related_terms: [leader_replaced_abandon_watch]

  - feature_id: candidate.theme_heat_rank
    display_name: 题材热度排名
    scope: symbol
    category: ranking
    value_type: number
    description: 标的所属题材在市场热度中的相对排序。
    related_terms: [leader_replaced_abandon_watch, catch_up_breakout]

  - feature_id: candidate.relative_core_rank
    display_name: 题材核心排名
    scope: symbol
    category: ranking
    value_type: number
    description: 标的在所属题材核心梯队内的相对位置，数值越小越核心。
    related_terms: [leader_replaced_abandon_watch, overtake_rotation]

  - feature_id: position.unrealized_return_percent
    display_name: 未实现收益率
    scope: position
    category: pnl
    value_type: number
    description: 持仓当前浮盈浮亏百分比。
    related_terms: [scale_out_take_profit]

  - feature_id: position.take_profit_stage
    display_name: 止盈阶段
    scope: position
    category: position_state
    value_type: string
    description: 持仓当前止盈推进阶段，如 none、partial_take_profit、scaled_out。
    related_terms: [scale_out_take_profit]

  - feature_id: position.trend_damage_confirmed
    display_name: 趋势破坏确认
    scope: position
    category: exit_signal
    value_type: boolean
    description: 持仓趋势结构已确认破坏，可触发彻底退出。
    related_terms: [scale_out_take_profit, acceptance_breakdown_exit]

  - feature_id: market.emotion_cycle
    display_name: 市场情绪周期
    scope: market
    category: market_state
    value_type: enum
    description: 当前市场情绪周期状态，例如 warm、hot、repair、cooling、panic。
    related_terms: [weak_to_strong, limit_up_reseal, leader_replaced_abandon_watch, scale_out_take_profit, market_emotion_cooling_freeze, market_high_level_open_board_deterioration_freeze, market_reseal_rate_drop_freeze, market_theme_cooling_freeze, overtake_rotation, catch_up_breakout]

  - feature_id: market.high_level_open_board_rate
    display_name: 高位开板率
    scope: market
    category: market_breadth
    value_type: number
    description: 高位强势股的开板比例，用于识别高位承接是否恶化。
    related_terms: [market_emotion_cooling_freeze, market_high_level_open_board_deterioration_freeze, market_reseal_rate_drop_freeze]

  - feature_id: market.limit_up_reseal_rate
    display_name: 回封成功率
    scope: market
    category: market_breadth
    value_type: number
    description: 当日炸板后成功回封的比例，用于刻画情绪强弱。
    related_terms: [market_emotion_cooling_freeze, market_high_level_open_board_deterioration_freeze, market_reseal_rate_drop_freeze]

  - feature_id: market.theme_breadth
    display_name: 题材扩散度
    scope: market
    category: market_breadth
    value_type: number
    description: 热门题材的扩散宽度和跟风数量，可辅助判断退潮或发酵。
    related_terms: [market_emotion_cooling_freeze, market_high_level_open_board_deterioration_freeze, market_reseal_rate_drop_freeze, market_theme_cooling_freeze, catch_up_breakout]

  - feature_id: candidate.relative_core_strength_score
    display_name: 相对核心强度分
    scope: symbol
    category: score
    value_type: number
    description: 标的相对题材龙头和同梯队个股的综合强度分。
    related_terms: [overtake_rotation]

  - feature_id: candidate.overtake_signal_confirmed
    display_name: 卡位确认事件
    scope: symbol
    category: theme_rotation
    value_type: boolean
    description: 标的已出现明确卡位上位信号，如强于原龙头或率先回封。
    related_terms: [overtake_rotation]

  - feature_id: candidate.lagging_return_percent
    display_name: 相对龙头滞涨幅度
    scope: symbol
    category: relative_strength
    value_type: number
    description: 标的相对龙头尚未完成的涨幅差，用于识别补涨空间。
    related_terms: [catch_up_breakout]

  - feature_id: candidate.breakout_neckline_ratio
    display_name: 突破颈线比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 当前价格相对关键突破颈线的比例。
    related_terms: [catch_up_breakout]

  - feature_id: candidate.theme_leader_locked
    display_name: 龙头锁定状态
    scope: symbol
    category: theme_rotation
    value_type: boolean
    description: 题材龙头地位是否已锁定，常作为补涨逻辑前提。
    related_terms: [catch_up_breakout]

  - feature_id: position.failed_engulfing_confirmed
    display_name: 反包失败确认
    scope: position
    category: exit_signal
    value_type: boolean
    description: 反包尝试失败并重新转弱，通常对应短线退出信号。
    related_terms: [failed_rebound_engulfing]

  - feature_id: position.acceptance_strength_score
    display_name: 承接强度得分
    scope: position
    category: orderflow
    value_type: number
    description: 买盘承接、抛压消化和盘口支撑的综合评分。
    related_terms: [acceptance_breakdown_exit, failed_rebound_engulfing, weak_to_strong_failed_gap_down_no_acceptance]

  - feature_id: position.intraday_pullback_percent
    display_name: 日内回撤幅度
    scope: position
    category: pnl
    value_type: number
    description: 日内从高点回落的幅度，可辅助判断抢跑和承接恶化。
    related_terms: [acceptance_breakdown_exit, failed_rebound_engulfing]

  - feature_id: candidate.high_divergence_confirmed
    display_name: 高位分歧确认
    scope: symbol
    category: board_behavior
    value_type: boolean
    description: 标的已进入高位分歧博弈状态，常见于高位开板、反复回封或抛压增大阶段。
    related_terms: [high_divergence_weakening]

  - feature_id: candidate.close_below_reference_ratio
    display_name: 收盘跌破参考位比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 当前价格相对分歧观察参考位的比例，小于 1 表示重新跌破参考位。
    related_terms: [high_divergence_weakening]

  - feature_id: market.high_level_divergence_rate
    display_name: 高位分歧率
    scope: market
    category: market_breadth
    value_type: number
    description: 高位强势股中出现明显分歧的比例，用于识别高位风险是否扩散。
    related_terms: [high_divergence_weakening]

  - feature_id: position.board_break_confirmed
    display_name: 断板确认
    scope: position
    category: board_behavior
    value_type: boolean
    description: 连板结构已被打断，原先板块强度叙事开始失效。
    related_terms: [broken_board_failed_rebound]

  - feature_id: position.rebound_attempt_failed
    display_name: 反抽尝试失败
    scope: position
    category: exit_signal
    value_type: boolean
    description: 断板后尝试反抽修复但未能形成有效承接和站回。
    related_terms: [broken_board_failed_rebound]

  - feature_id: position.close_below_intraday_reclaim_ratio
    display_name: 日内修复位失守比例
    scope: position
    category: price_structure
    value_type: number
    description: 当前价格相对日内反抽修复位的比例，小于 1 表示再次失守修复位。
    related_terms: [broken_board_failed_rebound]

  - feature_id: market.repair_reflow_confirmed
    display_name: 修复回流确认
    scope: market
    category: market_state
    value_type: boolean
    description: 市场情绪已经从退潮转入修复，且资金重新回流核心方向。
    related_terms: [emotion_reflow_repair]

  - feature_id: market.core_theme_return_rate
    display_name: 核心题材回流率
    scope: market
    category: market_breadth
    value_type: number
    description: 核心题材中重新走强个股的比例，用于判断修复是否具备持续性。
    related_terms: [emotion_reflow_repair]

  - feature_id: candidate.core_theme_reflow_rank
    display_name: 核心题材回流排名
    scope: symbol
    category: ranking
    value_type: number
    description: 标的在本轮情绪修复回流中的相对排序，越靠前越值得优先关注。
    related_terms: [emotion_reflow_repair]

  - feature_id: candidate.early_repair_strength_score
    display_name: 早盘修复强度分
    scope: symbol
    category: score
    value_type: number
    description: 标的在修复早段的承接、拉升和稳定性综合得分。
    related_terms: [emotion_reflow_repair]

  - feature_id: candidate.breakout_after_repair_ratio
    display_name: 修复后突破比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 标的在修复后相对回流突破位的比例，大于 1 表示已完成修复后突破。
    related_terms: [emotion_reflow_repair]

  - feature_id: candidate.consensus_acceleration_confirmed
    display_name: 一致加速确认
    scope: symbol
    category: board_behavior
    value_type: boolean
    description: 标的已进入强一致加速阶段，追涨资金高度集中。
    related_terms: [consensus_acceleration_exhaustion]

  - feature_id: candidate.intraday_chase_saturation_score
    display_name: 日内追高拥挤度分
    scope: symbol
    category: orderflow
    value_type: number
    description: 追高拥挤程度和换手消耗的综合得分，分值越高越接近衰竭边缘。
    related_terms: [consensus_acceleration_exhaustion]

  - feature_id: candidate.first_divergence_pullback_ratio
    display_name: 首次分歧回落比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 一致加速后的首次明显分歧回落幅度。
    related_terms: [consensus_acceleration_exhaustion]

  - feature_id: market.high_consensus_collapse_rate
    display_name: 高一致崩塌率
    scope: market
    category: market_breadth
    value_type: number
    description: 高一致加速个股中快速转弱或炸裂的比例，用于识别一致加速环境是否开始崩塌。
    related_terms: [consensus_acceleration_exhaustion]

  - feature_id: position.floor_to_limit_attempted
    display_name: 地天板尝试事件
    scope: position
    category: board_behavior
    value_type: boolean
    description: 标的已出现从深水到涨停方向的修复尝试。
    related_terms: [floor_to_limit_failed]

  - feature_id: position.limit_reseal_failed
    display_name: 回封失败
    scope: position
    category: board_behavior
    value_type: boolean
    description: 地天板修复过程中未能稳住涨停或关键回封区域。
    related_terms: [floor_to_limit_failed]

  - feature_id: position.close_below_limit_reclaim_ratio
    display_name: 失守回封位比例
    scope: position
    category: price_structure
    value_type: number
    description: 当前价格相对地天修复关键回封位的比例，小于 1 表示重新失守。
    related_terms: [floor_to_limit_failed]

  - feature_id: candidate.tail_ramp_attack_confirmed
    display_name: 尾盘偷袭确认
    scope: symbol
    category: event_state
    value_type: boolean
    description: 标的在前一交易日尾盘出现快速拉升或偷袭式进攻行为。
    related_terms: [tail_ramp_next_day_weakening]

  - feature_id: candidate.next_day_open_strength_ratio
    display_name: 次日开盘强度比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 次日开盘相对前一尾盘偷袭参考位的强弱比例。
    related_terms: [tail_ramp_next_day_weakening]

  - feature_id: candidate.next_day_volume_follow_ratio
    display_name: 次日量能跟随比例
    scope: symbol
    category: volume_price
    value_type: number
    description: 次日量能对前一日尾盘偷袭动作的跟随程度。
    related_terms: [tail_ramp_next_day_weakening]

  - feature_id: candidate.next_day_red_to_black_failed
    display_name: 次日红转黑失败
    scope: symbol
    category: event_state
    value_type: boolean
    description: 次日未能维持红盘或冲高回落转黑，说明尾盘偷袭缺乏持续性。
    related_terms: [tail_ramp_next_day_weakening]

  - feature_id: market.tail_attack_follow_through_rate
    display_name: 尾盘偷袭延续率
    scope: market
    category: market_breadth
    value_type: number
    description: 前一交易日尾盘偷袭个股在次日形成有效延续的比例。
    related_terms: [tail_ramp_next_day_weakening]

  - feature_id: position.thin_volume_rebound_attempted
    display_name: 地量反抽尝试
    scope: position
    category: event_state
    value_type: boolean
    description: 标的在缩量或地量背景下出现过反抽修复尝试。
    related_terms: [thin_volume_rebound_failed]

  - feature_id: position.rebound_confirmation_failed
    display_name: 反抽确认失败
    scope: position
    category: exit_signal
    value_type: boolean
    description: 反抽修复未能站稳关键确认位或未能持续获得承接。
    related_terms: [thin_volume_rebound_failed]

  - feature_id: position.close_below_rebound_pivot_ratio
    display_name: 失守反抽支点比例
    scope: position
    category: price_structure
    value_type: number
    description: 当前价格相对反抽支点的比例，小于 1 表示重新失守修复支点。
    related_terms: [thin_volume_rebound_failed]

  - feature_id: position.volume_recovery_ratio
    display_name: 反抽量能恢复比例
    scope: position
    category: volume_price
    value_type: number
    description: 反抽阶段量能恢复相对基准量能的比例，用于识别修复质量。
    related_terms: [thin_volume_rebound_failed]

  - feature_id: candidate.afternoon_chase_confirmed
    display_name: 午后抢筹确认
    scope: symbol
    category: event_state
    value_type: boolean
    description: 标的在午后出现明显资金抢筹或加速拉升行为。
    related_terms: [afternoon_chase_then_fade]

  - feature_id: candidate.afternoon_fade_drawdown_ratio
    display_name: 午后回落幅度比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 午后抢筹后从高点回落的幅度比例。
    related_terms: [afternoon_chase_then_fade]

  - feature_id: candidate.close_below_afternoon_attack_ratio
    display_name: 收盘跌破午后攻击位比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 当前价格相对午后攻击确认位的比例，小于 1 表示攻击结构失守。
    related_terms: [afternoon_chase_then_fade]

  - feature_id: market.afternoon_follow_through_rate
    display_name: 午后抢筹延续率
    scope: market
    category: market_breadth
    value_type: number
    description: 午后抢筹个股在随后时段或次日形成延续的比例。
    related_terms: [afternoon_chase_then_fade]

  - feature_id: candidate.counter_nuke_attempted
    display_name: 反核尝试事件
    scope: symbol
    category: event_state
    value_type: boolean
    description: 标的从深水弱势区间出现过快速反核或翘板尝试。
    related_terms: [counter_nuke_confirmation_failed]

  - feature_id: candidate.counter_nuke_confirmation_ratio
    display_name: 反核确认比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 反核后相对确认位的稳定比例，小于 1 表示确认失败。
    related_terms: [counter_nuke_confirmation_failed]

  - feature_id: candidate.bid_acceptance_score
    display_name: 买盘承接得分
    scope: symbol
    category: orderflow
    value_type: number
    description: 买盘承接、封单稳定性和回落消化能力的综合得分。
    related_terms: [counter_nuke_confirmation_failed]

  - feature_id: market.counter_nuke_success_rate
    display_name: 反核成功率
    scope: market
    category: market_breadth
    value_type: number
    description: 反核尝试个股中最终形成有效修复和延续的比例。
    related_terms: [counter_nuke_confirmation_failed]

  - feature_id: candidate.afternoon_reseal_attempted
    display_name: 午后回封尝试
    scope: symbol
    category: event_state
    value_type: boolean
    description: 标的在午后出现过明显回封或再度封板尝试。
    related_terms: [afternoon_reseal_failed]

  - feature_id: candidate.reseal_hold_minutes
    display_name: 回封维持分钟数
    scope: symbol
    category: board_behavior
    value_type: number
    description: 午后回封后维持强势结构的时间长度，越短越容易视为失败。
    related_terms: [afternoon_reseal_failed]

  - feature_id: candidate.close_below_reseal_pivot_ratio
    display_name: 收盘失守回封支点比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 当前价格相对午后回封支点的比例，小于 1 表示回封结构失守。
    related_terms: [afternoon_reseal_failed]

  - feature_id: market.afternoon_reseal_success_rate
    display_name: 午后回封成功率
    scope: market
    category: market_breadth
    value_type: number
    description: 午后回封尝试个股最终维持封板或强势结构的比例。
    related_terms: [afternoon_reseal_failed]

  - feature_id: candidate.first_board_yesterday_confirmed
    display_name: 昨日首板确认
    scope: symbol
    category: board_behavior
    value_type: boolean
    description: 标的上一交易日已完成首板确认。
    related_terms: [first_board_next_day_weak_to_weaker]

  - feature_id: candidate.next_day_open_below_expected_ratio
    display_name: 次日开盘低于预期比例
    scope: symbol
    category: price_structure
    value_type: number
    description: 次日开盘相对首板次日预期强度的比例，小于 1 表示低于预期。
    related_terms: [first_board_next_day_weak_to_weaker]

  - feature_id: candidate.next_day_follow_through_strength_score
    display_name: 次日延续强度分
    scope: symbol
    category: score
    value_type: number
    description: 首板次日承接、量能和继续走强能力的综合评分。
    related_terms: [first_board_next_day_weak_to_weaker]

  - feature_id: candidate.next_day_weak_to_weaker_confirmed
    display_name: 次日弱转弱确认
    scope: symbol
    category: event_state
    value_type: boolean
    description: 次日未能修复而是继续走弱，形成弱转弱确认。
